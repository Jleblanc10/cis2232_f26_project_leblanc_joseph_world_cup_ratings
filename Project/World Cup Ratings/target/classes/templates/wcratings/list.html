<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Player Ratings</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="container crud-page">

    <h1>World Cup Player Effectiveness Ratings</h1>

    <p>
        <a th:href="@{/wcratings/add}" class="button">Add Player Rating</a>
    </p>

    <div class="crud-table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Player</th>
                <th>Country</th>
                <th>Position</th>
                <th>Minutes</th>
                <th>Goals</th>
                <th>Assists</th>
                <th>Defensive Actions</th>
                <th>Yellow Cards</th>
                <th>Red Cards</th>
                <th>Effectiveness</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="player : ${players}">
                <td th:text="${player.playerName}"></td>
                <td th:text="${player.country}"></td>
                <td th:text="${player.position}"></td>
                <td th:text="${player.minutesPlayed}"></td>
                <td th:text="${player.goals}"></td>
                <td th:text="${player.assists}"></td>
                <td th:text="${player.defensiveActions}"></td>
                <td th:text="${player.yellowCards}"></td>
                <td th:text="${player.redCards}"></td>
                <td th:text="${#numbers.formatDecimal(player.playerEffectiveness, 1, 2)}"></td>

                <td>
                    <a th:href="@{/wcratings/edit/{id}(id=${player.id})}">Edit</a>

                    <form th:action="@{/wcratings/delete/{id}(id=${player.id})}"
                          method="post"
                          style="display:inline;">
                        <button type="submit"
                                onclick="return confirm('Are you sure you want to delete this player?')">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(players)}">
                <td colspan="11">No player ratings found.</td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

</body>
</html>
